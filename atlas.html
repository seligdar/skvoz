    <div id="app" class="atlas-page">
      <div id="atlas-scroll">

      <aside id="atlas-card" hidden>
        <!-- Карточка закрывалась только тычком в пустое место карты: на

        <button type="button" id="ac-close" aria-label="закрыть карточку">×</button>

        <div class="ac-name" id="ac-name"></div>

           нигде не было сказано, какая что значит. -->
      <div id="atlas-legend" aria-hidden="true">
        <span><i class="lg-open"></i>есть</span>
        <span><i class="lg-hint"></i>можно собрать</span>
        <span><i class="lg-shut"></i>закрыто</span>
        <!-- Только что открытый узел носит своё, сплошное рыжее кольцо:
             два разных рыжих знака на карте, а ключ объяснял один. -->
        <span id="lg-fresh" hidden><i class="lg-new"></i>только что открыто</span>
      </div>
