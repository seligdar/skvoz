<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#2b2e33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="СКВОЗЬ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-192.png" />
    <title>СКВОЗЬ · конструктор</title>
    <meta name="description" content="СКВОЗЬ" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23ece9e2'/><g fill='none' stroke='%232b2e33' stroke-width='2.4'><path d='M7 26V16a9 9 0 0 1 18 0v10'/><path d='M3 29h26'/></g></svg>" />
    <script>
      // витрину помечаем до первой отрисовки, иначе на миг видно палитру
      if (new URLSearchParams(location.search).get('attract') === '1') {
        document.documentElement.dataset.attract = '1';
      }
    </script>
    <script type="module" crossorigin src="./assets/editor-elcLtCoi.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/spike-Bkp1ek5k.js">
    <link rel="modulepreload" crossorigin href="./assets/device-CDJyhaKh.js">
    <link rel="modulepreload" crossorigin href="./assets/loop-D-vbIP3N.js">
    <link rel="modulepreload" crossorigin href="./assets/pixelRatio-DLxmMwxw.js">
    <link rel="modulepreload" crossorigin href="./assets/prologue-DVpvoFUY.js">
    <link rel="modulepreload" crossorigin href="./assets/campaign-_0wg1S28.js">
    <link rel="modulepreload" crossorigin href="./assets/region-BRiFY_Co.js">
    <link rel="modulepreload" crossorigin href="./assets/graph-DCScanXG.js">
    <link rel="modulepreload" crossorigin href="./assets/sheet-CfHmWWJ_.js">
    <link rel="modulepreload" crossorigin href="./assets/elementName-BtPU9xD6.js">
    <link rel="modulepreload" crossorigin href="./assets/confirmButton-DAZh_eBE.js">
    <link rel="modulepreload" crossorigin href="./assets/storageNotice-DuvZMpgO.js">
    <link rel="stylesheet" crossorigin href="./assets/spike-BK7Os4aY.css">
    <link rel="stylesheet" crossorigin href="./assets/loop-CVRt-vYo.css">
    <link rel="stylesheet" crossorigin href="./assets/editor-BP4_NmpV.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="titleblock">
        <div class="tb-name">СКВОЗЬ</div>
        <div class="tb-sheet">лист 02 · конструктор</div>
        <!-- Задание в штампе, как на настоящем чертеже: что строим, где, на
             сколько метров, на сколько лет и на какие деньги. Строки
             зачёркиваются по мере выполнения, пока идёт стройка, — чтобы
             узнать, сдано или нет, не нужно доводить прогон до конца. -->
        <div id="brief">
          <select id="brief-pick" aria-label="площадка"></select>
          <div class="br-task" id="brief-task"></div>
          <ul class="br-checks" id="brief-checks"></ul>
        </div>
      </div>

      <div id="orderbar" hidden>
        <!-- Телефон: плашка свёрнута в одну строку («зернохранилище · 4 м ·
             50 лет · 2300 у.е.»), тап раскрывает бриф и условия. Целиком
             она занимала треть экрана. -->
        <div class="ob-short" id="ob-short" hidden></div>
        <div class="ob-title" id="ob-title"></div>
        <!-- бриф заказа: единственная художественная строка игры; на телефоне
             штамп спрятан, и без этой строки она не показывалась никогда -->
        <div class="ob-brief" id="ob-brief" hidden></div>
        <div class="ob-goal" id="ob-goal"></div>
        <div class="ob-goal" id="ob-region" hidden></div>
        <div class="ob-cost" id="ob-cost"></div>
      </div>

      <!-- Панель стройки внизу во всю ширину, как каталог в build-режиме:
           слева чем строить, дальше из чего, дальше что делать с чертежом.
           Раньше это была россыпь текстовых кнопок в верхнем углу, и найти
           среди них нужную можно было только прочитав все. -->
      <div id="palette">
        <div class="bar-group" id="order-actions" hidden>
          <button id="ob-submit">сдать заказ</button>
        </div>
        <div class="bar-group" id="tools">
          <button data-tool="wall" class="on" title="стена">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 17h20M2 12h20M2 7h20M7 7v5M12 12v5M17 7v5M4.5 12v5M19.5 12v5M9.5 7V4M14.5 7V4" /></svg>
            <span>стена</span>
          </button>
          <button data-tool="room" title="комната">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3z" /><path d="M6 6h12v12H6z" /></svg>
            <span>комната</span>
          </button>
          <button data-tool="column" title="колонна">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21h10M7 3h10M9 3v18M15 3v18M8 6h8M8 18h8" /></svg>
            <span>колонна</span>
          </button>
          <button data-tool="slab" title="плита">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10l10-5 10 5-10 5z" /><path d="M2 10v3l10 5 10-5v-3" /></svg>
            <span>плита</span>
          </button>
          <button data-tool="arch" title="арка">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V12a9 9 0 0118 0v9" /><path d="M7 21v-9a5 5 0 0110 0v9" /></svg>
            <span>арка</span>
          </button>
          <button data-tool="opening" title="проём">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21h20M2 21V6h20v15" /><path d="M9 21v-7a3 3 0 016 0v7" /></svg>
            <span>проём</span>
          </button>
        </div>

        <div class="bar-sep" aria-hidden="true"></div>

        <!-- Отмена, поворот и разрез жили только на клавишах Z/Y, R и V.
             На телефоне клавиш нет: ошибку было нечем отменить, тело нечем
             повернуть, а разреза здания не существовало вовсе. -->
        <div class="bar-group" id="history">
          <button id="undo-btn" data-act="undo" title="отменить (Z)" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h11a5 5 0 0 1 0 10h-6" /><path d="M8 5L4 9l4 4" /></svg>
            <span>отмена</span>
          </button>
          <button id="redo-btn" data-act="redo" title="вернуть (Y)" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9H9a5 5 0 0 0 0 10h6" /><path d="M16 5l4 4-4 4" /></svg>
            <span>вернуть</span>
          </button>
          <button id="rotate-btn" data-act="rotate" title="повернуть тело (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
            <span>повернуть</span>
          </button>
          <button id="section-btn" data-act="section" title="разрез здания (V)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12" /><path d="M12 4v16" stroke-dasharray="3 2" /></svg>
            <span>разрез</span>
          </button>
        </div>

        <div class="bar-sep" aria-hidden="true"></div>

        <div class="bar-group" id="edits">
          <button data-tool="move" title="двигать">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3" /></svg>
            <span>двигать</span>
          </button>
          <button data-tool="paint" title="перебрать материал">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h11a2 2 0 0 1 2 2v2H4z" /><path d="M4 8V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v3" /><path d="M17 12h2a1 1 0 0 1 1 1v3a2 2 0 0 1-2 2h-1" /><path d="M9 12v4a2 2 0 0 0 2 2h1" /></svg>
            <span>материал</span>
          </button>
          <button data-tool="erase" class="danger" title="снести">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13" /><path d="M8 10l8 8M16 10l-8 8" /></svg>
            <span>снести</span>
          </button>
        </div>

        <div class="bar-sep" aria-hidden="true"></div>

        <div class="bar-col">
          <div class="bar-label">материал</div>
          <div class="chips" id="mats">
            <button data-mat="stone" class="on">камень</button>
          </div>
        </div>

        <div class="bar-sep" aria-hidden="true"></div>

        <div class="bar-col" id="sheet-col">
          <div class="bar-label">чертёж</div>
          <div class="chips">
            <button id="mirror-btn">зеркало</button>
            <span id="level-label">этаж 0</span>
            <button id="mix-btn">замес</button>
            <button id="share-btn">ссылка</button>
            <button id="clear-btn">новый лист</button>
          </div>
        </div>
        <!-- Первые заказы на телефоне: одиннадцать плиток в прокрутке никому не
             нужны, нужны комната, арка, плита, снести и отмена. Остальное за
             кнопкой «все инструменты». -->
        <div class="bar-group" id="bar-more" hidden>
          <button id="bar-more-btn" type="button">ещё</button>
        </div>
      </div>

      <!-- лестница этажей: до неё этаж переключался только клавишами Q/E -->
      <div id="floors" aria-label="этажи"></div>

      <!-- рамка выделения под сносом: видно, что именно улетит -->
      <div id="marquee" hidden></div>

      <!-- Выноска: что встанет и почему не встанет. Раньше это была строка
           внизу листа: на телефоне она пряталась под панелью свойств, а то,
           о чём она говорила, лежало под пальцем. Теперь линия идёт от точки
           касания вверх и в сторону к полке с текстом, как выноска на чертеже. -->
      <svg id="gauge-leader" aria-hidden="true" hidden><polyline points="" /><circle r="2.6" /></svg>
      <div id="gauge" hidden></div>
      <!-- Проводка по первому заказу: одна строка над приговором, которая
           смотрит на настоящее состояние чертежа и говорит следующий шаг.
           Исчезает навсегда после первой сдачи. -->
      <div id="guide" hidden>
        <span id="guide-text"></span>
        <button id="guide-hide" type="button" title="скрыть подсказку" aria-label="скрыть подсказку">×</button>
      </div>
      <div id="forecast">
        <div id="forecast-text"></div>
        <button id="forecast-fold" type="button" title="свернуть приговор" aria-label="свернуть приговор">×</button>
      </div>

      <!-- главное действие листа: построил — проверь, сколько простоит -->
      <!-- Смета на виду: внутри приговора она пряталась за многоточием, а это
           единственное число, которое игрок держит в голове всю стройку. -->
      <div id="purse" hidden></div>
      <button type="button" id="check-btn" title="прогон по векам: чертёж уедет на лист веков" disabled>проверить</button>
      <div id="mixpanel" hidden>
        <div class="props-title">замес · рецепт на м³</div>
        <label class="props-row">вяжущее
          <select id="mix-binder"></select>
        </label>
        <label class="props-row">вяжущее <output id="mix-binder-kg-out">350</output> кг
          <input id="mix-binder-kg" type="range" min="120" max="550" step="10" value="350" />
        </label>
        <label class="props-row">вода <output id="mix-water-out">175</output> кг
          <input id="mix-water" type="range" min="110" max="290" step="5" value="175" />
        </label>
        <label class="props-row">песок <output id="mix-sand-out">700</output> кг
          <input id="mix-sand" type="range" min="300" max="1100" step="25" value="700" />
        </label>
        <label class="props-row">щебень <output id="mix-gravel-out">1100</output> кг
          <input id="mix-gravel" type="range" min="500" max="1500" step="25" value="1100" />
        </label>
        <label class="props-row">пластификатор <output id="mix-plast-out">0</output> %
          <input id="mix-plast" type="range" min="0" max="1.5" step="0.1" value="0" />
        </label>
        <label class="props-row">воздух <output id="mix-air-out">0</output> %
          <input id="mix-air" type="range" min="0" max="8" step="0.5" value="0" />
        </label>
        <div class="props-title" id="mix-out"></div>
        <div id="mix-warn"></div>
        <label class="props-row">выдержка <output id="mix-age-out">28 сут</output>
          <input id="mix-age" type="range" min="0" max="100" step="1" value="42" />
        </label>
        <label class="props-row">погода <output id="mix-temp-out">20 °C</output>
          <input id="mix-temp" type="range" min="2" max="35" step="1" value="20" />
        </label>
        <div id="mix-micro-wrap">
          <canvas id="mix-micro" width="160" height="78" aria-hidden="true"></canvas>
          <div id="mix-micro-cap"></div>
        </div>
        <div id="mix-viz" aria-hidden="true">
          <svg id="mix-cone" viewBox="0 0 72 78">
            <path class="pile" d="M22 62 Q36 62 50 62 L46 66 Q36 68 26 66 Z" />
            <path class="mold" d="M24 20 L48 20 L42 62 L30 62 Z" />
            <line x1="18" y1="66" x2="54" y2="66" stroke="currentColor" stroke-width="1" opacity="0.35" />
          </svg>
          <svg id="mix-curve" viewBox="0 0 160 78">
            <line class="axis" x1="28" y1="10" x2="28" y2="58" />
            <line class="axis" x1="28" y1="58" x2="150" y2="58" />
            <line class="tick" x1="57" y1="58" x2="57" y2="61" />
            <line class="tick" x1="78" y1="58" x2="78" y2="61" />
            <line class="tick" x1="116" y1="58" x2="116" y2="61" />
            <text x="52" y="72">7</text>
            <text x="71" y="72">28</text>
            <text x="107" y="72">год</text>
            <text x="4" y="14">МПа</text>
            <path class="curve" id="mix-curve-path" d="" />
            <text id="mix-curve-fc" x="120" y="18"></text>
          </svg>
        </div>
        <div class="props-row"><button id="mix-save">сохранить смесь</button></div>
      </div>

      <!-- Чертёж, пришедший по ссылке. Прежде о нём спрашивало системное окно
           прямо на запуске: серая коробка поверх ещё не нарисованного листа,
           и поток стоял, пока человек её читает. Полоса на самом листе ждёт
           столько, сколько нужно, и ничего не задерживает. -->
      <div id="linkoffer" hidden>
        <span id="linkoffer-text"></span>
        <span class="lo-actions">
          <button id="linkoffer-open" type="button">открыть присланный</button>
          <button id="linkoffer-keep" type="button">оставить свой</button>
        </span>
      </div>

      <div id="props" hidden>
        <!-- Снять выбор можно было только клавишей Escape, а на телефоне лист
             свойств занимает треть экрана и держит её, пока не выберешь другое
             тело: закрыть его было нечем. -->
        <div class="props-head">
          <div class="props-title" id="props-id"></div>
          <button id="props-close" type="button" title="закрыть" aria-label="снять выбор">×</button>
        </div>
        <!-- Размеры первыми: на телефоне лист свойств в четверть экрана, и
             «стрела», к которой ведёт проводка, была ниже сгиба за материалом. -->
        <label class="props-row" id="props-h-row">
          высота <output id="h-out">3,0</output> м
          <input id="props-h" type="range" min="1" max="30" step="1" />
        </label>
        <label class="props-row" id="props-thick-row">
          <span id="thick-label">толщина стены</span> <output id="thick-out">0,5</output> м
          <input id="props-thick" type="range" min="1" max="6" step="1" />
        </label>
        <label class="props-row" id="props-t-row">
          толщина <output id="t-out">0,25</output> м
          <input id="props-t" type="range" min="0.1" max="0.6" step="0.05" />
        </label>
        <label class="props-row" id="props-rise-row">
          стрела <output id="rise-out">0,6</output> м
          <input id="props-rise" type="range" min="0.2" max="2" step="0.1" />
        </label>
        <div class="props-row" id="props-mats"></div>
        <div class="props-row" id="props-rebar-row"></div>
        <label class="props-row" id="props-cover-row">
          защитный слой <output id="cover-out">30</output> мм
          <input id="props-cover" type="range" min="5" max="80" step="5" />
        </label>
        <div class="props-row">
          <button id="props-delete">снести</button>
        </div>
      </div>

    </div>
  </body>
</html>
