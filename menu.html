    <script type="module" crossorigin src="./assets/menu-fo5PCSix.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/spike-Bkp1ek5k.js">
    <link rel="modulepreload" crossorigin href="./assets/device-CDJyhaKh.js">
    <link rel="modulepreload" crossorigin href="./assets/campaign-_0wg1S28.js">
    <link rel="modulepreload" crossorigin href="./assets/prologue-DVpvoFUY.js">
    <link rel="modulepreload" crossorigin href="./assets/sheet-CfHmWWJ_.js">
    <link rel="modulepreload" crossorigin href="./assets/elementName-BtPU9xD6.js">
    <link rel="modulepreload" crossorigin href="./assets/records-rrOyz4zX.js">
    <link rel="modulepreload" crossorigin href="./assets/confirmButton-DAZh_eBE.js">

    <link rel="stylesheet" crossorigin href="./assets/menu-DPRPl9cl.css">
  </head>
  <body>
    <div id="app" class="menu">
      <!-- Одна сцена во весь экран, как в главном меню большой игры: Нотр-Дам
           стоит и стареет, а меню лежит поверх него. Три равные панели читались
           тремя чужими окнами и не давали ни одному кадру быть главным. -->
      <div class="cell" id="stage-bg">
        <!-- Адрес ставит меню, а не разметка: на телефоне сцену выбирает
             устройство, и загрузку нельзя начинать до того, как выбор сделан. -->
        <iframe
          data-scene="./spike.html?attract=1&demo=notredame"
          title="лист 03 · века"
        ></iframe>
        <!-- Телефон: тот же Нотр-Дам, но кадром, а не живой сценой. Живая
             занимала главный поток на полторы секунды при открытии меню;
             кадр снят с витрины (infra/e2e/menu-bg-phone.mjs). -->
        <img id="stage-img" alt="" hidden data-src="./pwa/menu-notredame-phone.png" />
      </div>
      <div id="veil"></div>

      <!-- игровой цикл: заказы кампании (docs/07) -->
      <section id="orders" hidden>
        <header id="orders-head">
          <div id="orders-head-text">
            <div class="ord-title">заказы</div>
            <div class="ord-points">очков знания: <b id="ord-points-num">0</b></div>
            <div class="ord-era" id="ord-era"></div>
            <div class="ord-next" id="ord-next"></div>
          </div>
          <button id="orders-close">закрыть</button>
        </header>
        <div id="orders-list"></div>
      </section>

      <!-- финал кампании: что осталось стоять на конец календаря -->
      <section id="finale" hidden>
        <header id="finale-head">
          <div>
            <div class="ord-title">итог веков</div>
            <div class="ord-points" id="fin-sub"></div>
          </div>
          <button id="finale-close">закрыть</button>
        </header>
        <div id="finale-list"></div>
      </section>

      <header id="brand">
        <h1 id="title">СКВОЗЬ</h1>
        <!-- весть портфеля: мир дожил до чьего-то обрушения -->
        <button id="news" hidden></button>
      </header>

      <!-- Одна дверь вместо многих: «играть» ведёт прямо в текущий заказ
           кампании, «заказы» — лестница, «мастерская» — свободная игра
           (вещества, дерево, стройка и века живут там вкладками). -->
      <nav id="items" aria-label="разделы">
        <button class="item play" id="play-btn" data-go="editor.html">
          <span id="play-word">играть</span>
          <span id="play-sub" class="play-sub"></span>
        </button>
        <button class="item" id="orders-btn">заказы · 0 оч.</button>
        <button class="item" data-go="play.html">мастерская · стройка без заказа</button>
      </nav>
      <div id="corner">
        <div id="stamp">
          <div class="st-row st-name">СКВОЗЬ</div>
          <div class="st-row">лист 00 · меню</div>
          <div class="st-row st-meta">↑ ↓ выбрать · ↵ открыть</div>
        </div>
        <button id="wipe">стереть чертежи</button>
      </div>
    </div>
  </body>
</html>
